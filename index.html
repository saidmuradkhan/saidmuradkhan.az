<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Said Muradkhan — Full-Stack Developer</title>
    <meta name="description" content="Said Muradkhan — Full-Stack Developer in Baku. I build web applications and internal systems with PHP, Laravel, React and Node.js." />
    <meta name="author" content="Said Muradkhan" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Said Muradkhan — Full-Stack Developer" />
    <meta property="og:description" content="PHP · Laravel · React · Node.js — web applications that are simple, fast and reliable." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="/theme.js"></script>
    <style>
      html, body { margin: 0; background: #0a0a0b; }
      .boot { position: fixed; inset: 0; background: #1fce75; }
      :root[data-theme='light'] .boot { background: #087f45; }
      :root[data-theme='light'] .pre-mark { color: #fff; }
      .pre-mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 0.18em; color: #0a0a0b; font: 500 clamp(44px, 9vw, 110px)/1 'JetBrains Mono', ui-monospace, monospace; pointer-events: none; }
      .pre-mark b { font-weight: 500; animation: pre-brace 1.2s ease-in-out infinite; }
      .pre-mark b:first-child { --dir: -1; }
      .pre-mark b:last-child { --dir: 1; }
      .pre-mark i { width: 0.14em; height: 0.14em; border-radius: 50%; background: currentColor; animation: pre-dot 1.2s ease-in-out infinite; }
      .pre-mark i:nth-of-type(2) { animation-delay: 0.15s; }
      .pre-mark i:nth-of-type(3) { animation-delay: 0.3s; }
      @keyframes pre-dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-0.28em); opacity: 1; } }
      @keyframes pre-brace { 50% { transform: translateX(calc(var(--dir) * 0.12em)); } }
      @media (prefers-reduced-motion: reduce) { .pre-mark b, .pre-mark i { animation: none; opacity: 1; } }
      .boot-msg { position: absolute; left: 0; right: 0; bottom: 12vh; padding: 0 16px; text-align: center; color: #0a0a0b; font: 500 15px/1.6 Inter, system-ui, sans-serif; opacity: 0; visibility: hidden; animation: boot-show 0.6s ease 5s forwards; }
      .boot-msg a { display: inline-block; margin-top: 14px; padding: 12px 26px; border-radius: 999px; background: #0a0a0b; color: #f3efe8; text-decoration: none; font-weight: 500; }
      .boot-msg.now { animation-delay: 0s; }
      :root[data-theme='light'] .boot-msg { color: #fff; }
      @keyframes boot-show { to { opacity: 1; visibility: visible; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="pre-mark" aria-hidden="true"><b>{</b><i></i><i></i><i></i><b>}</b></div>
        <p class="boot-msg" role="status">This is taking longer than usual — check your connection.<br /><a href="/">Reload the page</a></p>
        <noscript><p class="boot-msg now">This site needs JavaScript to run. Please enable it and reload.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
